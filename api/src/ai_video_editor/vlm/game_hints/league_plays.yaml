  propose: "one ally death, no enemy death, victim alone by assisters, not in lane"
  start: {story: approach, montage: engage, fallback: "first_kill - 8"}
  end: {rule: "death + 2", max_after_last_kill_s: 2}
  vlm_confirms: [type, numbers, outcome]
  facts_from_riot: [sides, kills, deaths, objective_after]
  examples: []

trade:
  phase: [early, mid]
  propose: "no kill: HP reader when enabled, else the VLM sweep"
  start: {story: approach, montage: engage, fallback: "first_kill - 8"}
  end: {rule: "both back off", max_after_last_kill_s: 8}
  vlm_confirms: [type, numbers, outcome]
  facts_from_riot: [sides, kills, deaths, objective_after]
  examples: []
