# Play vocabulary (league). The proposer rules are code (league/plays.py `_classify`);
# `propose` here only describes them. This file carries each type's start and end rules
# (read by the confirmer prompt, apply_confirmation and the planner) and examples.
# Override by placing a file of the same name in GAME_HINTS_DIR (or <workspace>/game_hints).

teamfight:
  phase: [early, mid, late]
  propose: ">= 3 enemy deaths and >= 6 champions touched a kill"
  start: {story: approach, montage: engage, fallback: "first_kill - 8"}
  end: {rule: "outcome", max_after_last_kill_s: 20}
  vlm_confirms: [type, numbers, outcome]
  facts_from_riot: [sides, kills, deaths, objective_after]
  examples: []

skirmish:
  phase: [early, mid, late]
  propose: "everything else that has a kill"
  start: {story: approach, montage: engage, fallback: "first_kill - 8"}
  end: {rule: "outcome", max_after_last_kill_s: 20}
  vlm_confirms: [type, numbers, outcome]
  facts_from_riot: [sides, kills, deaths, objective_after]
  examples: []

objective_fight:
  phase: [mid, late]
  propose: "an elite kill within 30 s after, or the first kill inside the dragon or baron pit"
  start: {story: approach, montage: engage, fallback: "first_kill - 8"}
  end: {rule: "outcome", max_after_last_kill_s: 20}
  vlm_confirms: [type, numbers, outcome]
  facts_from_riot: [sides, kills, deaths, objective_after]
  examples: []

closeout:
  phase: [mid, late]
  propose: ">= 3 enemy deaths within 60 s of game end"
  start: {story: approach, montage: engage, fallback: "first_kill - 8"}
  end: {rule: "outcome", max_after_last_kill_s: 20}
  vlm_confirms: [type, numbers, outcome]
  facts_from_riot: [sides, kills, deaths, objective_after]
  examples: []

gank:
  phase: [early]
  propose: "early phase, one kill, three champions, in a lane"
  start: {story: approach, montage: engage, fallback: "first_kill - 8"}
  end: {rule: "outcome", max_after_last_kill_s: 10}
  vlm_confirms: [type, numbers, outcome]
  facts_from_riot: [sides, kills, deaths, objective_after]
  examples: []

dive:
  phase: [early, mid, late]
  propose: "a kill within 800 units of a standing enemy or ally tower"
  start: {story: approach, montage: engage, fallback: "first_kill - 8"}
  end: {rule: "outcome", max_after_last_kill_s: 15}
  vlm_confirms: [type, numbers, outcome]
  facts_from_riot: [sides, kills, deaths, objective_after]
  examples: []

caught_out:
